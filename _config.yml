title: Yongkang Chen
description: Short essays and notes by Yongkang Chen.
author: Yongkang Chen
url: https://ykchen824.github.io
baseurl: ""

markdown: kramdown
highlighter: rouge

# Both plugins are on the GitHub Pages allow-list.
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Atom feed for essays at /writing/feed.xml.
feed:
  collections:
    writing:
      path: "/writing/feed.xml"

collections:
  writing:
    output: true
    permalink: /writing/:name/

defaults:
  - scope:
      path: "_writing"
      type: writing
    values:
      layout: post

# Not published. (_templates/ is skipped automatically because of the underscore.)
exclude:
  - README.md
