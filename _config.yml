title: Yongkang Chen
description: Short essays and notes by Yongkang Chen.
author: Yongkang Chen
url: https://ykchen824.github.io
baseurl: ""

markdown: kramdown
highlighter: rouge

# These plugins are on the GitHub Pages allow-list.
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

redirect_from:
  json: false

# The Atom feed at /feed.xml is hand-built (see feed.xml) so that it can merge
# the writing and fails collections into a single subscription.

collections:
  writing:
    output: true
    permalink: /writing/:name/
  fails:
    output: true
    permalink: /fails/:name/

defaults:
  - scope:
      path: "_writing"
      type: writing
    values:
      layout: article
  - scope:
      path: "_fails"
      type: fails
    values:
      layout: article

# Not published. (_templates/ is skipped automatically because of the underscore.)
exclude:
  - README.md
