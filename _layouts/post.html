<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="{{ page.summary | default: page.title | escape }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:type" content="article" />
<meta property="og:title" content="{{ page.title | escape }}" />
<meta property="og:description" content="{{ page.summary | default: page.title | escape }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
<title>{{ page.title }} — Yongkang Chen</title>
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}" />
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body class="post-page">
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="bar">
    <a class="brand" href="{{ '/' | relative_url }}">Yongkang Chen</a>
    <nav aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}">About</a>
      <a href="{{ '/#research' | relative_url }}">Publications</a>
      <a href="{{ '/writing/' | relative_url }}" aria-current="page">Writing</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
      <span aria-hidden="true">◐</span>
    </button>
  </div>
</header>

<main id="main" class="post-main">
  <article class="post-layout">
    <header class="post-head">
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </header>

    <nav class="post-toc" aria-label="Table of contents">
      <details>
        <summary>Table of Contents</summary>
        <ol id="post-toc-list"></ol>
      </details>
    </nav>

    <div class="post-body" id="post-body">
      {{ content }}
    </div>
  </article>
</main>

<footer class="site-footer">
  <div class="bar">
    <span>© 2026 Yongkang Chen</span>
    <div class="foot-links"><a href="mailto:ykchen824@foxmail.com">Email</a><a href="#main">Back to top ↑</a></div>
  </div>
</footer>

<script>
  (() => {
    const root = document.documentElement;
    const toggle = document.querySelector('.theme-toggle');
    const media = matchMedia('(prefers-color-scheme: dark)');
    // Without a stored choice the page follows the system theme.
    const current = () => root.dataset.theme || (media.matches ? 'dark' : 'light');
    const sync = () => toggle?.setAttribute('aria-pressed', String(current() === 'dark'));
    sync();
    media.addEventListener('change', sync);
    toggle?.addEventListener('click', () => {
      const next = current() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch {}
      sync();
    });

    const toc = document.querySelector('#post-toc-list');
    const headings = [...document.querySelectorAll('#post-body h2, #post-body h3')];
    headings.forEach((heading, index) => {
      if (!heading.id) heading.id = `section-${index + 1}`;
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent;
      item.append(link);
      toc?.append(item);
    });
    if (!headings.length) document.querySelector('.post-toc')?.remove();
  })();
</script>
</body>
</html>
