# Copy an entry into _data/publications.yml, keeping the file newest first.
# Quote values that contain ": " (common in titles and venues).
- id: short-slug
  year: 2026
  title: "Paper Title: With a Subtitle"
  short: Short Label                        # Concise label for the Research Map.
  sub: 2-word subtitle                      # Muted subtitle next to Short Label.
  url: https://example.com/paper            # Optional. The title links here.
  authors: Coauthor One, Yongkang Chen, Coauthor Two*.   # "*" = corresponding author
  venue: Conference or Journal, 2026.
  venue_short: Venue'26                     # Short venue chip for the map/index.
  topic: llm-safety                         # llm-safety | llm-evaluation | adversarial
  # highlight: true                         # Optional. Ringed dot on the Research Map.
  # award: Best Paper                       # Optional. Highlighted award badge.
  # related: [other-slug]                   # Optional. Dashed links on hover.
  tags: [CCF-A, Best Paper]                 # Optional. CCF-A/B/C or an award label.
  # lang: zh-CN                             # Optional, for non-English entries.
  bib: |
    @inproceedings{chen2026example,
      title={Paper Title: With a Subtitle},
      author={One, Coauthor and Chen, Yongkang and Two, Coauthor},
      booktitle={Conference or Journal},
      year={2026}
    }
